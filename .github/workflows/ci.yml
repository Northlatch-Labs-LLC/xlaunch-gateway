name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: "Gate: lint"
        run: npm run lint --if-present
      - name: "Gate: test"
        run: npm run test --if-present
