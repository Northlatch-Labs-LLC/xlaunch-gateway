<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        // Mirrors the ThemeProvider's resolution: 'system' (or nothing stored)
        // follows the OS preference. Keep in sync with src/theme.tsx.
        const theme = localStorage.getItem('theme')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const dark = theme === 'dark' || (theme !== 'light' && prefersDark)
        if (dark) {
          document.documentElement.classList.add('dark')
        }
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document.documentElement.dataset.themeChoice =
          theme === 'dark' || theme === 'light' ? theme : 'system'
        // Same idea for text direction; keep in sync with RTL_LOCALES in
        // src/i18n/locale-config.ts.
        const locale = localStorage.getItem('xlaunch-gateway.locale')
        if (locale && ['ar', 'he', 'fa', 'ur'].includes(locale)) {
          document.documentElement.dir = 'rtl'
        }
      } catch {
        // Keep the initial render working if localStorage is unavailable.
      }
    </script>
    <title>Xlaunch Gateway · Unified LLM Router</title>
    <meta
      name="description"
      content="Self-hosted LLM gateway: one OpenAI-compatible endpoint for 44+ providers, with automatic failover, per-key quotas and analytics. Commercially licensed."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Xlaunch Gateway" />
    <meta property="og:title" content="Xlaunch Gateway · One endpoint for every AI provider" />
    <meta
      property="og:description"
      content="One OpenAI-compatible endpoint for 44+ providers. Self-hosted, commercially licensed — your keys, your rules."
    />
    <!-- og:url/og:image stay unset on purpose: a self-hosted gateway has no
         canonical public origin to name. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
